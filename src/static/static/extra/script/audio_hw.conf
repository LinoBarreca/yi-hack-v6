#!/bin/sh

# 6.0.1 - yi-hack-v6
#
# Audio hardware descriptor, per camera model. HARDWARE FACTS (not user settings):
# how to power the speaker amplifier and the acodec DAC output level. Sourced by
# native_pipeline.sh, which looks up the running model and passes the values to
# campipe (and to the aoplay test tool) as env: CAMPIPE_AMP_ON / CAMPIPE_AMP_OFF /
# CAMPIPE_DAC_VOL. The C side applies AMP_ON/OFF as a list of `addr=val` register
# writes via /dev/mem, and DAC_VOL via the acodec DACL/DACR volume ioctl.
#
# AMP_ON / AMP_OFF : space-separated `0xADDR=0xVAL` writes (dir/data/pinmux as the
#                    board needs) to enable / disable the external speaker amp.
# DAC_VOL          : acodec vol_ctrl, INVERTED scale - 0x00 = loudest .. 0x7F = mute.
#
# Adding a model: read stock's registers with the speaker working and diff against
# a silent boot (see the `reg` tool / register-diff in the design doc), then add a
# `case` arm. Unknown model returns non-zero -> no audio-out, speaker left untouched.

# audio_hw <model_suffix> : on success sets AMP_ON, AMP_OFF, DAC_VOL and returns 0.
audio_hw() {
    case "$1" in
        y20)
            # SOI JXF22 board: external amp enable = GPIO6_6 (verified on hardware
            # 2026-07-23 via stock-vs-native register diff + A/B test). GPIO6 base
            # 0x201A0000: dir reg +0x400 (bit6 output), data at mask-addr +0x100.
            AMP_ON="0x201A0400=0x40 0x201A0100=0x40"
            AMP_OFF="0x201A0100=0x00"
            DAC_VOL=0x00
            ;;
        *)
            # Unknown/unmapped model: no verified amp control -> stay silent & safe.
            return 1
            ;;
    esac
    return 0
}
