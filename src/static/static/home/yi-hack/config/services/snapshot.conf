# Snapshot feature.
# ENABLED    - take snapshots (yes/no).
# RESOLUTION - motion/event snapshot resolution (high/low). low uses the
#              low-CPU native path; high decodes via libavcodec.
# WATERMARK  - overlay the timestamp watermark on the motion/event snapshot
#              (yes/no). (The web snapshot CGI keeps its own per-request flags.)
ENABLED=yes
RESOLUTION=high
WATERMARK=yes
