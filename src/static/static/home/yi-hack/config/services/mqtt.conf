###############################################################################
#                    Configuration file for the MQTT service                  #
#                                                                             #
# Centrally-managed MQTT *connection* settings (overridable from the share, 6.2). #
# Connection keys carry the BROKER_ prefix for clarity (it's the broker's        #
# IP/port/credentials, not the camera's). Per-camera identity (MQTT_CLIENT_ID,    #
# MQTT_PREFIX) lives in identity.conf. Read with: get_config services.mqtt.<KEY>  #
###############################################################################

# -----------------------------------------------------------------------------
# Basic MQTT settings
# -----------------------------------------------------------------------------

BROKER_IP=0.0.0.0
BROKER_PORT=1883

BROKER_USER=
BROKER_PASSWORD=

# NOTE: MQTT_CLIENT_ID and MQTT_PREFIX are per-camera identity -> config/identity.conf
# (they must be unique per camera; this file is centrally managed/overridable).

# -----------------------------------------------------------------------------
# Set the topics where the messages will be published.
# The final topic will be MQTT_PREFIX/TOPIC_MOTION
# -----------------------------------------------------------------------------

TOPIC_BIRTH_WILL=status
TOPIC_MOTION=motion_detection
TOPIC_MOTION_IMAGE=motion_detection_image
MOTION_IMAGE_DELAY=0.5
TOPIC_MOTION_FILES=motion_files
TOPIC_SOUND_DETECTION=sound_detection

# -----------------------------------------------------------------------------
# Set the topic messages
# -----------------------------------------------------------------------------

BIRTH_MSG=online
WILL_MSG=offline
MOTION_START_MSG=motion_start
MOTION_STOP_MSG=motion_stop
AI_HUMAN_DETECTION_MSG=human
AI_VEHICLE_DETECTION_MSG=vehicle
AI_ANIMAL_DETECTION_MSG=animal
BABY_CRYING_MSG=crying
SOUND_DETECTION_MSG=sound_detected

# -----------------------------------------------------------------------------
# Other settings
# -----------------------------------------------------------------------------

KEEPALIVE=120
QOS=1
RETAIN_BIRTH_WILL=1
RETAIN_MOTION=0
RETAIN_MOTION_IMAGE=0
RETAIN_MOTION_FILES=0
RETAIN_SOUND_DETECTION=0
