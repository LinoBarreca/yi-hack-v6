# ONVIF server.
# WSDD        - enable WS-Discovery so the camera is found automatically (yes/no).
# PROFILE     - which profile(s) to expose: high, low or both.
# NETIF       - network interface to use (wlan0 or eth0).
# The stream login is the one set in rtsp.conf; the snapshot watermark follows
# services/snapshot.conf WATERMARK (single source).
ENABLED=no
WSDD=no
PROFILE=high
NETIF=wlan0
