# ONVIF server.
# WSDD        - enable WS-Discovery so the camera is found automatically (yes/no).
# PROFILE     - which profile(s) to expose: high, low or both.
# WM_SNAPSHOT - add a watermark to ONVIF snapshots (yes/no).
# NETIF       - network interface to use (wlan0 or eth0).
# The stream login is the one set in rtsp.conf.
ENABLED=no
WSDD=no
PROFILE=high
WM_SNAPSHOT=no
NETIF=wlan0
