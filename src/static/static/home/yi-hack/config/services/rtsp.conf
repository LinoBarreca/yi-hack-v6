# RTSP video stream.
# STREAM         - which stream to serve: high, low or both.
# AUDIO          - microphone codec on the stream: no, aac or g711.
#                  aac  = smaller stream, and the only one MP4 can hold, so it is
#                         the one to pick if you want sound in recorded clips.
#                  g711 = encoded by the SoC itself, so nearly free in CPU, but a
#                         constant 64 kbit/s, 8kHz only, and NOT recordable to MP4
#                         (clips become video-only).
# AUDIO_QUALITY  - microphone sample rate: low (8kHz) or high (16kHz). Native
#                  pipeline and AUDIO=aac only (g711 is 8kHz by definition). This
#                  is the whole audio codec's rate (one clock for mic and
#                  speaker), not just the stream's.
# AUDIO_NR_LEVEL - audio noise-reduction level (0 = off, max 25).
# PORT           - TCP port (default 554).
# TIME_OSD       - show the time overlay on the video (yes/no).
# USER/PASSWORD  - login for the stream, also used by ONVIF (leave empty for none).
#                  These guard the two-way audio too: an unauthenticated stream
#                  means anyone on the network can talk through the speaker.
ENABLED=no
STREAM=high
AUDIO=aac
AUDIO_QUALITY=low
AUDIO_NR_LEVEL=0
PORT=554
TIME_OSD=no
USER=
PASSWORD=
