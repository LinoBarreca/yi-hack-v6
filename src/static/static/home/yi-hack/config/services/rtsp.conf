# RTSP video stream.
# STREAM         - which stream to serve: high, low or both.
# AUDIO          - enable audio on the stream (yes/no).
# AUDIO_NR_LEVEL - audio noise-reduction level (0 = off).
# PORT           - TCP port (default 554).
# TIME_OSD       - show the time overlay on the video (yes/no).
# USER/PASSWORD  - login for the stream, also used by ONVIF (leave empty for none).
ENABLED=no
STREAM=high
AUDIO=no
AUDIO_NR_LEVEL=0
PORT=554
TIME_OSD=no
USER=
PASSWORD=
