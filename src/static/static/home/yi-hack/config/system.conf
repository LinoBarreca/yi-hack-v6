# System-wide settings. Per-service options are in their own files under services/.
# TIMEZONE          - timezone string (e.g. Europe/Rome). Empty = not set.
# DEBUG_LOG         - keep a boot/debug log (yes/no), for troubleshooting only.
# DISABLE_CLOUD     - turn off the Yi app and all cloud features / private mode (yes/no).
# REC_WITHOUT_CLOUD - keep recording on the SD card while the cloud is disabled (yes/no).
# CHECK_UPDATES     - check for yi-hack updates (yes/no).
# CRONTAB           - your own scheduled jobs, in crontab syntax.
# NOTE: swap is configured in output.conf (SWAP), not here.
TIMEZONE=
DEBUG_LOG=no
DISABLE_CLOUD=no
REC_WITHOUT_CLOUD=no
CHECK_UPDATES=no
CRONTAB=
