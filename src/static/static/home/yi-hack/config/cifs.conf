ENABLED=no
HOST=
SHARE=
USER=guest
PASS=
SEC=ntlmssp
VERS=1.0
RETRY=10
RETRY_DELAY=6

# Recording share (read-write), mounted when output.RECORD=CIFS. This is a
# SEPARATE share from the read-only firmware share above (the payload is RO).
# There is NO RECORDING_ENABLED: whether it is mounted is decided by
# output.RECORD=CIFS. Any RECORDING_* left empty inherits the matching field
# above, so if the recordings live on the same server with the same credentials
# you only need to set RECORDING_SHARE.
RECORDING_HOST=
RECORDING_SHARE=
RECORDING_USER=
RECORDING_PASS=
RECORDING_SEC=
RECORDING_VERS=
