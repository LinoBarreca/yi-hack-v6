ENABLED=no
HOST=
SHARE=
USER=guest
PASS=
SEC=ntlmssp
VERS=1.0
RETRY=10
RETRY_DELAY=6

# Output share (read-write), mounted at /tmp/cifs-rw at every boot when configured.
# This is a SEPARATE share from the read-only firmware share above (mounted at
# /tmp/cifs-ro; the payload is RO). build_view routes any output category set to
# CIFS (recordings, service logs) to this mount. Configured = RW_HOST and/or
# RW_SHARE set; any other RW_* left empty inherits the matching field above, so
# if the outputs live on the same server with the same credentials you only need
# to set RW_SHARE.
RW_HOST=
RW_SHARE=
RW_USER=
RW_PASS=
RW_SEC=
RW_VERS=
