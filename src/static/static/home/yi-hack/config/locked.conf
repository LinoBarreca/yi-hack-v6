# Build-time locked settings for this camera model - deployed by pack_fw.sh
# (per-model overlay), NEVER user-editable on the camera. One per line, in the
# get_config dotted syntax plus the FORCED value. example:
#
#     services.rtsp.STREAM=low        # model can only encode the low stream
#     camera.MOTION_TRACKING=no       # camera doesn't rotate, so no motion tracking
#
# A key listed here cannot be changed from the share (apply_config), the web UI,
# the rescue UI or MQTT cmnd/; restore_locked_configs.sh re-stamps the forced
# values (boot + on demand). The generic build ships this file EMPTY.
