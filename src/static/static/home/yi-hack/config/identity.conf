###############################################################################
#                    Per-camera IDENTITY (class 1, LOCAL)                     #
#                                                                             #
# These values are UNIQUE PER CAMERA and must NOT be managed centrally: they  #
# are excluded from the share->flash config override (sections 5.7, 6.2) so a #
# mass push never makes two cameras collide. Read with: get_config identity.X #
###############################################################################

# MQTT client id - MUST be unique per camera (a duplicate id makes the broker
# disconnect the other client).
MQTT_CLIENT_ID=yi-cam

# MQTT topic prefix - MUST be unique per camera (otherwise the cameras' topics
# collide, e.g. two cameras both publishing to yicam/motion_detection).
MQTT_PREFIX=yicam

# Home Assistant device identity (DONT USE SPACES in IDENTIFIERS). Unique per
# camera so HA registers a distinct device for each.
HOMEASSISTANT_NAME=Yi Camera
HOMEASSISTANT_IDENTIFIERS=yi-cam
