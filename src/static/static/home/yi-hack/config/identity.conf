###############################################################################
#                          Per-camera identity                               #
#                                                                             #
# These must be UNIQUE per camera. Leave any value BLANK to auto-fill it at   #
# boot from the camera's factory serial (the string on its sticker, read from #
# the vendor flash). set_defaults.sh fills empty values on first boot; a value #
# you set explicitly is kept and never overwritten.                           #
###############################################################################

# MQTT client id - unique per camera (a duplicate id makes the broker
# disconnect the other client). Blank -> serial.
MQTT_CLIENT_ID=

# MQTT topic prefix - unique per camera (otherwise topics collide, e.g. two
# cameras both publishing to <prefix>/motion_detection). Blank -> serial.
MQTT_PREFIX=

# Home Assistant device. IDENTIFIERS must be unique (no spaces); blank -> serial.
# NAME is the friendly label shown in HA; blank -> "Yi Camera <serial>".
HOMEASSISTANT_NAME=
HOMEASSISTANT_IDENTIFIERS=
