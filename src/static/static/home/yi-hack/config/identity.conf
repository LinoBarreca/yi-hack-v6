###############################################################################
#                          Per-camera identity                               #
#                                                                             #
# These values must be UNIQUE for each camera. If two cameras share them they #
# collide (same MQTT client/topic, same Home Assistant device).              #
###############################################################################

# MQTT client id - must be unique per camera (a duplicate id makes the broker
# disconnect the other client).
MQTT_CLIENT_ID=yi-cam

# MQTT topic prefix - must be unique per camera (otherwise the cameras' topics
# collide, e.g. two cameras both publishing to yicam/motion_detection).
MQTT_PREFIX=yicam

# Home Assistant device identity (do NOT use spaces in IDENTIFIERS). Unique per
# camera so Home Assistant registers a distinct device for each.
HOMEASSISTANT_NAME=Yi Camera
HOMEASSISTANT_IDENTIFIERS=yi-cam
