# Recording retention.
# FREE_SPACE - percentage of free space to keep on the SD card; the oldest
#              recordings are deleted when usage exceeds it. 0 disables cleanup.
FREE_SPACE=10
# SEGMENT_TIME - native recorder MP4 segment length, in seconds (see the output
#                matrix RECORD in output.conf). One file per segment.
SEGMENT_TIME=60
# STREAM       - which stream to RECORD: high (1080p) or low (640x360). Independent
#                of services.rtsp STREAM, which decides what is PUBLISHED - you can
#                serve 1080p to viewers and still record the small stream.
#                On y20, recording high needs a swap file: ffmpeg buffering a 1080p
#                stream wants ~11MB and that board has ~30MB total, so without swap
#                it is OOM-killed on sight. With SWAP_FILE=NO in output.conf, y20
#                falls back to low - see the recorder log. Other models are NOT
#                gated: their memory has not been measured, so they are left to try.
#                Only a stream that services.rtsp actually publishes can be recorded.
STREAM=low
