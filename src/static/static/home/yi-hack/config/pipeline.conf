# Video pipeline (advanced, v6-native). Applied at boot — reboot to change.
# MODE - which media pipeline runs:
#        stock   - the Xiaomi stack (rmm/dispatch). Cloud, app, stock motion.
#        online  - v6 native pipeline, VI-VPSS online. Lowest latency/RAM, but
#                  lens distortion correction (LDC) is NOT available.
#        offline - v6 native pipeline, VI-VPSS offline. LDC available, at a
#                  small latency/RAM cost.
# LDC  - lens distortion correction strength 0..100 (0 = off). Only has an
#        effect when MODE=offline; ignored otherwise.
MODE=stock
LDC=0
