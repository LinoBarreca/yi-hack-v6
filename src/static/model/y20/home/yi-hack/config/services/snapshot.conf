# Snapshot feature.
# ENABLED    - snapshot capture backend: no (disabled), legacy (imggrabber,
#              software H.264-decode capture), v6 (hwsnap, fast direct hardware
#              JPEG capture -- low resolution is a fixed 320x192 in this mode).
# RESOLUTION - motion/event snapshot resolution (high/low). legacy low uses the
#              low-CPU native path; legacy high decodes via libavcodec.
# WATERMARK  - overlay the timestamp watermark on the motion/event snapshot
#              (yes/no). (The web snapshot CGI keeps its own per-request flags.)
ENABLED=v6
RESOLUTION=high
WATERMARK=yes
