<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <title>yi-hack-v6</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="ui/app.css" />

    <script src="cgi-bin/hostname.js"></script>
    <script src="ui/tz-data.js"></script>
    <script src="ui/app.js"></script>
    <script src="ui/rules.js"></script>
    <script defer src="vendor/alpine.min.js"></script>
    <script src="vendor/bootstrap.bundle.min.js"></script>
</head>

<body x-data>
<div class="yh-app">

    <aside class="yh-side">
        <a class="yh-brand" href="?page=status">
            <div class="cam"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8l14-4 1.5 5.5L4 13.5z"/><circle cx="9" cy="9" r="1.6" fill="currentColor" stroke="none"/><path d="M6 13.5V19h6"/></svg></div>
            <div><b>yi-hack-v6</b><small x-text="$store.ui.status.fw_version || ''"></small></div>
        </a>

        <template x-for="group in ['Camera','Setup']" :key="group">
            <div>
                <div class="yh-navlabel" x-text="group"></div>
                <nav class="yh-nav">
                    <template x-for="p in $store.ui.pages.filter(x => x.group === group)" :key="p.id">
                        <a :href="'?page=' + p.id"
                           :class="{ on: $store.ui.page === p.id }"
                           @click="$event.preventDefault(); $store.ui.open(p.id)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
                            <span x-text="p.label"></span>
                        </a>
                    </template>
                </nav>
            </div>
        </template>

        <div class="foot">
            <button class="btn btn-sm btn-outline-secondary" @click="$store.ui.toggleTheme()">
                Toggle light / dark
            </button>
            <span>SSH · telnet · rescue UI<br />always available</span>
        </div>
    </aside>

    <div class="yh-main">
        <div class="yh-top">
            <span class="host">
                <span x-text="$store.ui.hostname"></span>
                <small x-text="[$store.ui.status.serial_number, $store.ui.status.local_ip].filter(Boolean).join(' · ')"></small>
            </span>
            <span class="flex-grow-1"></span>
            <span class="pill" x-show="$store.ui.status.firmware_source">
                <span class="dot ok"></span>
                <span x-text="'Yi-Hack firmware in: ' + ({network:'network share', sd:'SD card', rescue:'flash (rescue)'}[$store.ui.status.firmware_source] || '…')"></span>
            </span>
            <span class="pill" x-show="$store.ui.cloudPill()">
                <span :class="($store.ui.cloudPill() || {}).dot"></span>
                <span x-text="($store.ui.cloudPill() || {}).text"></span>
            </span>
            <span class="pill" x-show="$store.ui.status.recorder_running === 'yes'">
                <span class="dot crit"></span>Recording
            </span>
        </div>

        <div class="yh-content" id="page-host">
            <!-- ui/pages/<page>.html is injected here by the router -->
        </div>
    </div>

</div>

<!-- persistent notices (SD provisioning warnings etc.) — dismissed manually -->
<div class="yh-toasts">
    <template x-for="(t, i) in $store.ui.toasts" :key="i">
        <div class="yh-toast">
            <span x-text="t"></span>
            <button type="button" class="btn-close" aria-label="Dismiss"
                    @click="$store.ui.dismissToast(i)"></button>
        </div>
    </template>
</div>
</body>
</html>
